#
# Environment file for the nl6 systemd service.
#
# NL6_OPTS holds the command-line flags passed to `nl6`. systemd splits the
# value on whitespace, so list flags separated by spaces. Run `nl6 -help`
# (or see https://github.com/labmonkeys-space/nl6) for the full flag list.
#
# Examples:
#   NL6_OPTS="-port 8080 -auto-start-ip 10.42.0.1 -auto-count 100"
#   NL6_OPTS="-port 8080 -snmpv3-engine-id 8000000001020304 -snmpv3-auth sha1"
#
NL6_OPTS="-port 8080"
