apiVersion: v2
name: nl6-minion
description: |
  nl6 network-device simulator with an OpenNMS Minion sidecar (Kafka transport).
  Single-node lab convenience deployment — Kubernetes is NOT an officially
  supported target for nl6 (see docs/explanation/kubernetes.md). The Minion shares the
  pod's hostNetwork so it inherits the host routes nl6 installs into the
  nl6sim namespace and can poll the simulated devices directly.
type: application
version: 0.1.7
# appVersion is the nl6 image tag this chart defaults to. GHCR tags keep the v prefix.
appVersion: "v0.32.0"
keywords:
  - nl6
  - opennms
  - minion
  - snmp
  - simulator
home: https://nl6.eu
maintainers:
  - name: Ronny Trommer
    email: ronny@no42.org
