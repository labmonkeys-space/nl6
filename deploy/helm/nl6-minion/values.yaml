#
# Default values for nl6-minion.
# This chart deploys ONE pod containing two containers:
#   1. nl6      — the network-device simulator (owns host network mutation)
#   2. minion   — an OpenNMS Minion sidecar that polls the simulated devices
#
# ⚠️  SECURITY WARNING ⚠️
# This chart requires hostNetwork:true and privileged capabilities that weaken
# node isolation. It is intended ONLY for dedicated lab/test nodes, NOT for
# production clusters or shared multi-tenant environments. See the security
# section below and docs/ops/kubernetes.md for full risk assessment.
#
# The pod runs with hostNetwork: true so the Minion shares the node's network
# stack and inherits the /24 host routes nl6 installs into the nl6sim namespace.
# Because of the singleton host resources nl6 owns (netns name, veth pair,
# bridge CIDR), this is a single-replica, single-node deployment by design.

# ---------------------------------------------------------------------------
# Security Configuration
# ---------------------------------------------------------------------------
security:
  # -- REQUIRED: Acknowledge the security risks of this deployment.
  #    Set to true to confirm you understand this chart deploys a privileged
  #    pod with host network access on a dedicated, isolated node.
  #    The deployment will fail if this is not explicitly set to true.
  acknowledgeRisks: false

  # -- Deploy a NetworkPolicy to restrict access to the nl6 HTTP API.
  #    Recommended: restrict to specific namespaces/pods that need API access.
  #    Requires a CNI that enforces NetworkPolicy (Calico, Cilium, etc.).
  networkPolicy:
    enabled: false
    # -- Ingress rules for the nl6 API port. Default: deny all.
    #    Example: allow from monitoring namespace:
    #    - from:
    #      - namespaceSelector:
    #          matchLabels:
    #            name: monitoring
    ingress: []

  # -- Recommended node isolation via taints. Apply these taints to the target
  #    node to prevent other workloads from co-locating with the simulator:
  #      kubectl taint nodes <node> nl6-simulator=true:NoSchedule
  #    Then uncomment the toleration below.
  # tolerations:
  #   - key: nl6-simulator
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule

# -- Pin the pod to one node. nl6 mutates that node's network stack, so the
#    placement must be stable. REQUIRED: Set this to a dedicated lab node.
#    ⚠️  Use a node that is isolated from production workloads.
nodeSelector: {}
  # kubernetes.io/hostname: lab-node-01
  # node-role.kubernetes.io/nl6-simulator: "true"

tolerations: []
affinity: {}

# -- Extra pod-level labels/annotations.
podLabels: {}
podAnnotations: {}

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for the pod.
  create: true
  # -- Name override; defaults to the fullname when empty.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# nl6 simulator container
# ---------------------------------------------------------------------------
nl6:
  image:
    repository: ghcr.io/labmonkeys-space/nl6
    tag: ""            # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent

  # -- CLI flags passed to the nl6 binary. These auto-create a batch of devices
  #    and install the host routes the Minion relies on. Tune the IP/count to
  #    your lab; keep the subnet inside a /16 you can route.
  #
  # ⚠️  SECURITY NOTE: The HTTP API (-port 8080) has NO built-in authentication.
  #    With hostNetwork:true, this port is exposed on the node's IP. Restrict
  #    access via NetworkPolicy (see security.networkPolicy above) or deploy
  #    an authenticating reverse proxy. Do NOT expose this API to untrusted
  #    networks — it provides mutating control over simulated devices and can
  #    be used to trigger network namespace operations on the host node.
  args:
    - "-auto-start-ip"
    - "10.42.0.1"
    - "-auto-count"
    - "50"
    - "-port"
    - "8080"

  # -- nl6 security context. This configuration is REQUIRED for the simulator
  #    to function with network namespace isolation (the default mode).
  #
  # ⚠️  SECURITY IMPLICATIONS:
  #    - privileged:true grants unrestricted access to the host, including the
  #      ability to load kernel modules, access all devices, and bypass most
  #      security restrictions. This is required for /dev/net/tun access and
  #      network namespace operations.
  #    - CAP_SYS_ADMIN allows setns(CLONE_NEWNET) to enter the nl6sim namespace
  #      and is effectively "new root" — it can be used for container escape.
  #    - CAP_NET_ADMIN allows network configuration changes including routes,
  #      iptables rules, and sysctls that affect the node when combined with
  #      hostNetwork:true.
  #
  #    MITIGATION: Deploy only on a dedicated, isolated node with no other
  #    workloads. Use node taints, PodSecurityPolicy/PodSecurity admission,
  #    and NetworkPolicy to limit blast radius. See docs/ops/kubernetes.md.
  #
  #    ALTERNATIVE: Set privileged:false and rely on explicit capabilities only
  #    (requires kernel and PodSecurity policy that allow /dev/net/tun access
  #    via capabilities alone — not all environments support this).
  securityContext:
    privileged: true
    # Explicit capabilities are redundant when privileged:true but documented
    # here for the privileged:false alternative path.
    capabilities:
      add:
        - NET_ADMIN       # TUN creation, link/route config, iptables, sysctls
        - SYS_ADMIN       # setns(CLONE_NEWNET) into nl6sim namespace
        - NET_BIND_SERVICE # bind privileged ports (UDP/161,162,514, TCP/22)
      drop:
        - ALL             # Drop all other capabilities (only effective if privileged:false)

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # -- Liveness/readiness against the HTTP control plane (-port above).
  probes:
    enabled: true
    port: 8080

# ---------------------------------------------------------------------------
# OpenNMS Minion sidecar
# ---------------------------------------------------------------------------
minion:
  image:
    repository: opennms/minion
    tag: "33.1.6"        # pin to your OpenNMS Horizon/Meridian Minion version
    pullPolicy: IfNotPresent

  # -- Minion identity. id must be unique per Minion; location must match a
  #    Monitoring Location configured in the OpenNMS core.
  id: "nl6-minion-01"
  location: "nl6-lab"

  # -- OpenNMS core HTTP(S) URL. The Minion uses this for REST + provisioning.
  #    Works whether the core is external or an in-cluster Service — just point
  #    at whichever is reachable from the node's host network:
  #      external:   "http://opennms.example.com:8980/opennms"
  #      in-cluster: "http://opennms-core.opennms.svc.cluster.local:8980/opennms"
  #    NOTE: with hostNetwork:true, in-cluster Service DNS resolves via the
  #    node's resolv.conf (dnsPolicy ClusterFirstWithHostNet is set for you).
  httpUrl: "http://opennms-core.opennms.svc.cluster.local:8980/opennms"

  # -- Credentials the Minion uses against the OpenNMS REST API. Stored in a
  #    chart-managed Secret and exposed to the container as env vars. If you
  #    manage credentials with an existing Secret, set existingSecret and the
  #    userKey/passKey instead.
  credentials:
    username: "minion"
    password: "minion"
    existingSecret: ""     # if set, username/password above are ignored
    userKey: "username"
    passKey: "password"

  # -- Kafka transport. The Minion talks to the OpenNMS core over Kafka topics
  #    (sink + RPC + twin). bootstrapServers must be reachable from the node's
  #    host network — external broker or in-cluster Service both work:
  #      external:   "kafka.example.com:9092"
  #      in-cluster: "kafka.kafka.svc.cluster.local:9092"
  kafka:
    bootstrapServers: "kafka.kafka.svc.cluster.local:9092"
    # -- Extra org.opennms.core.ipc.* / Kafka client properties merged verbatim
    #    into minion-config.yaml under ipc.kafka (e.g. SASL/TLS settings).
    extraProperties: {}
      # security.protocol: "SASL_PLAINTEXT"
      # sasl.mechanism: "PLAIN"

  # -- Free-form extra keys merged into minion-config.yaml at the top level
  #    (e.g. system properties, dominion/grpc tuning). Advanced use.
  extraConfig: {}

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # -- Minion exposes Karaf health on :8181/minion/rest/health once up.
  probes:
    enabled: true
    port: 8181
