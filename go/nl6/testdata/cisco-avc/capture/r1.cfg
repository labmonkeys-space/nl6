! Startup configuration for the c8000v in avc.clab.yml (appended to
! vrnetlab's bootstrap config). This is the record IOS-XE 26.01.02 ACCEPTS
! with URI statistics: `collect application http uri statistics` requires
! `match connection id`, which requires `cache timeout event transaction-end`
! on the monitor. A `collect connection id` is refused ("must be defined as a
! match field"), and a record without the connection id is refused at
! interface bind ("'uri statistics' must have 'connection id' or
! 'transaction-id'"). The monitor must be defined before it is bound.
interface GigabitEthernet2
 description to client
 ip address 10.10.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 description to server
 ip address 10.10.2.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet4
 description to collector
 ip address 10.10.3.1 255.255.255.0
 no shutdown
!
flow record AVC-REC
 match ipv4 version
 match ipv4 protocol
 match ipv4 source address
 match ipv4 destination address
 match transport source-port
 match transport destination-port
 match interface input
 match flow direction
 match application name
 match connection id
 collect application http host
 collect application http uri statistics
 collect interface output
 collect counter bytes long
 collect counter packets long
 collect timestamp absolute first
 collect timestamp absolute last
!
flow exporter AVC-EXP
 destination 10.10.3.10
 source GigabitEthernet4
 transport udp 4739
 export-protocol ipfix
 template data timeout 60
 option interface-table timeout 60
 option application-table timeout 60
!
flow monitor AVC-MON
 exporter AVC-EXP
 cache timeout inactive 5
 cache timeout active 10
 cache timeout event transaction-end
 record AVC-REC
!
interface GigabitEthernet2
 ip nbar protocol-discovery
 ip flow monitor AVC-MON input
 ip flow monitor AVC-MON output
!
