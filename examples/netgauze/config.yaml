# NetGauze collector config for `make test-interop-yangpush`.
#
# Adapted from crates/collector/config_udpnotif_telemetry.yaml in NetGauze
# v0.13.0. Changes: the listener is UDP 10000 on the host network, the NETCONF
# login is nl6's simadmin with the key the make target generates and mounts at
# /keys/id_ed25519, and the output is the Kafka JSON endpoint instead of the
# YANG endpoint, so the test reads plain JSON and needs no schema registry.
# Enrichment and custom YANG schemas are left out on purpose: the gate checks
# that NetGauze fetches the YANG library from the device itself.
runtime:
  threads: 4

logging:
  level: netgauze_collector=info,netgauze_yang_push=info,info
  ansi: false

# The OpenTelemetry Collector in compose.yml receives these on 4318 and serves
# them to the test as Prometheus text. A 10 s interval fits the 150 s run.
telemetry:
  url: http://127.0.0.1:4318/v1/metrics
  id: nl6-interop-netgauze
  exporter_timeout: 3000
  reader_interval: 10000
  reader_timeout: 3000

udp_notif:
  subscriber_timeout: 100
  listeners:
    - address: "[::]:10000"
      workers: 2

  cache_location: /tmp/netgauze-udpnotif-cache

  netconf:
    username: simadmin
    private_key_path: /keys/id_ed25519
    port: 830

  publishers:
    group1:
      buffer_size: 1000
      endpoints:
        json-endpoint: !TelemetryKafkaJson
          topic: telemetry-message-json
          producer_config:
            bootstrap.servers: 127.0.0.1:19092
            message.timeout.ms: "60000"
            queue.buffering.max.messages: "1000"
          writer_id: nl6-interop-netgauze-json
