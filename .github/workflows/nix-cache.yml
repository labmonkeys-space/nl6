name: Nix Cache

# Build the nl6 Nix package and push it (plus its built dependencies) to
# Cachix, so `nix build github:labmonkeys-space/nl6?dir=deploy/packages/nix#nl6`
# substitutes prebuilt paths instead of compiling.
#
# Security: pushes ONLY on push to main / tags — never on pull_request, so the
# CACHIX_AUTH_TOKEN write credential is never exposed to fork PRs. The push is
# a no-op (skips with a notice) until the CACHIX_AUTH_TOKEN secret is
# configured. See deploy/packages/README.md.
#
# The BUILD, however, is also the pull-request gate for vendorHash freshness: a
# go.mod bump without a matching vendorHash refresh in package.nix fails only
# at nix-build time (buildGoModule substitutes the previously cached vendor
# tree keyed by the stale hash → "inconsistent vendoring"), and with no PR gate
# that failure used to surface only after merge, on main. When the build fails
# on a PR, the print-expected-vendorHash step below emits the correct hash to
# copy into package.nix.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'deploy/packages/nix/**'
      - 'go/**'
      - '.github/workflows/nix-cache.yml'
  # NOTE: there is deliberately NO `paths:` filter here, and no `branches:`
  # filter either. Both matrix legs of the job below are REQUIRED status checks
  # on main ("Build & push (x86_64-linux)" / "Build & push (aarch64-linux)").
  # GitHub matches a required check by CONTEXT NAME, and a context that never
  # reports stays PENDING. It is not treated as skipped. A `paths:` filter here
  # would therefore block every pull request that does not touch those paths,
  # which is most of them, forever. Do not reinstate it.
  #
  # The path relevance test did not disappear, it moved INSIDE the job (see the
  # "Decide whether this run touches the Nix inputs" step): an unrelated PR
  # reports success in seconds without checking out or building anything, while
  # a PR that touches the Nix inputs still runs the full unconditional build.
  # The `push:` filter above is untouched, because required checks only bind
  # pull requests and changing it would change when Cachix pushes happen.
  pull_request:
  workflow_dispatch:

# Cachix auth uses its own token; the GITHUB_TOKEN only needs to read the repo
# and, on a pull request, the PR's own file list.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache:
    name: Build & push (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04       # x86_64-linux
            system: x86_64-linux
          - runner: ubuntu-24.04-arm   # aarch64-linux (free for public repos)
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Set this to your Cachix cache name (also update flake.nix nixConfig).
      CACHIX_NAME: nl6
    steps:
      # Relevance is decided from the file list GitHub itself computed for the
      # PR, rather than from a `git diff` in the work tree: on `pull_request`
      # actions/checkout gives a MERGE ref at the default shallow depth, so a
      # diff would first need the right base object fetched and the right parent
      # picked, and it would answer against whatever main had merged in by then.
      # The API answers exactly the set the old `paths:` filter matched, needs
      # no checkout at all (so an unrelated PR costs one request), and adds no
      # action dependency. If the request fails we treat the run as relevant:
      # an extra build is cheap, a skipped vendorHash gate is not.
      - name: Decide whether this run touches the Nix inputs
        id: relevant
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            # push (already paths-filtered above) and workflow_dispatch always build.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "::notice::Could not list this PR's files. Building anyway."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same four path patterns the `pull_request: paths:` filter named.
          if printf '%s\n' "$files" | grep -Eq '^(deploy/packages/nix/.|go/go\.(mod|sum)$|\.github/workflows/nix-cache\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Nix build input touched by this PR. Reporting success without building."
          fi

      - name: Checkout
        if: steps.relevant.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on Cachix being configured
        id: cfg
        if: steps.relevant.outputs.run == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CACHIX_AUTH_TOKEN secret not set — skipping cache build/push."
          fi

      # The build itself is unconditional for a relevant run. It is the PR gate
      # for vendorHash freshness. Only the Cachix PUSH is conditional (push
      # events with the token; never pull_request, so the write credential stays
      # away from fork PRs).
      - name: Install Nix
        if: steps.relevant.outputs.run == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        if: steps.relevant.outputs.run == 'true' && github.event_name != 'pull_request' && steps.cfg.outputs.ready == 'true'
        # cachix ships major-only release tags (v10..v17, no v17.x.x), so the
        # comment tracks the major it publishes — the SHA is the immutable pin.
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: ${{ env.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # cachix-action pushes every path built after it runs, so on push events
      # this build both produces and uploads the nl6 closure; on pull_request
      # it only validates. git+file://?dir= is the local analogue of the
      # github:?dir= ref consumers use (the flake lives in a subdirectory but
      # its source is the whole repo).
      - name: Build nl6 (and push to Cachix on push events)
        if: steps.relevant.outputs.run == 'true'
        run: nix build "git+file://$PWD?dir=deploy/packages/nix#nl6" --no-link --print-out-paths

      # A stale vendorHash fails the step above WITHOUT naming the correct
      # hash (the substituted stale vendor tree fails as "inconsistent
      # vendoring" instead of a hash mismatch). Rebuild once with a fake hash
      # to force the fixed-output derivation to run and print the real one,
      # so the fix is a copy-paste into package.nix (or `make
      # nix-vendor-hash` locally).
      - name: Print expected vendorHash on failure
        if: failure() && steps.relevant.outputs.run == 'true'
        env:
          # The automated repair only ever touches Dependabot go_modules
          # branches (see dependabot-vendorhash.yml's guards). Telling a human
          # PR author that a sweep will fix their branch would be false, and
          # they would wait for something that is never coming.
          SWEEP_APPLIES: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/') }}
        run: |
          sed -i 's|vendorHash = ".*"|vendorHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="|' deploy/packages/nix/package.nix
          # path: (unlike git+file:) reads the dirty work tree, so the sed
          # needs no temporary commit.
          out=$(nix build "path:$PWD?dir=deploy/packages/nix#nl6" --no-link 2>&1 || true)
          echo "$out" | grep -E 'specified:|got:' || { echo "$out" | tail -20; exit 0; }
          want=$(echo "$out" | grep 'got:' | awk '{print $2}')
          hint=''
          if [ "$SWEEP_APPLIES" = 'true' ]; then
            hint=" You can also leave it: the Dependabot vendorHash workflow sweeps every ~6h and pushes this value onto the branch. Dispatch it with the PR number to skip the wait."
          fi
          echo "::error file=deploy/packages/nix/package.nix::vendorHash is stale for the current go.mod/go.sum. Set vendorHash = \"$want\" (or run 'make nix-vendor-hash').$hint"
