name: Actions lint

# Lints the workflows themselves — actionlint (syntax, expressions, shellcheck
# on run-blocks) + zizmor (security auditor: injection, permissions, pinning).
# So the Actions-hygiene rules are enforced mechanically on every change to
# .github/workflows/, not by review.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/zizmor.yml', 'Makefile']
  pull_request:
    paths: ['.github/workflows/**', '.github/zizmor.yml', 'Makefile']

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Lint workflows
        run: make lint-actions
