name: Gates

# The single definition of the quality gates — build + test and code quality.
# Called via `workflow_call` by CI (PR + main), the RC/preview build (main
# push, in ci.yml), and Release (tag). Defining them once means a release can
# never publish through a gate that PRs enforce, and the two can't drift.
on:
  workflow_call:
    inputs:
      assert-version-matches-tag:
        description: >-
          Assert the built binary's and the Nix package's version equal the
          pushed tag. Release-only; bakes APP_VERSION from the tag.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Release calls bake the tag (git describe is unreliable in a shallow
      # clone); PR/push calls leave it empty and the Makefile falls back to
      # git describe.
      APP_VERSION: ${{ inputs.assert-version-matches-tag && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate APP_VERSION format
        # Defense in depth: validate APP_VERSION before it reaches the Makefile.
        # Allowed characters match the Makefile's validation: [A-Za-z0-9._+-]+
        # This prevents shell injection even if the Makefile validation is bypassed.
        if: ${{ inputs.assert-version-matches-tag }}
        run: |
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "ERROR: Tag name '${GITHUB_REF_NAME}' contains unsafe characters."
            echo "Allowed characters: [A-Za-z0-9._+-]+"
            exit 1
          fi
          echo "Tag validation passed: ${GITHUB_REF_NAME}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify go.mod is tidy
        run: make check-tidy

      - name: Build
        run: make build

      - name: Assert baked version matches tag
        if: ${{ inputs.assert-version-matches-tag }}
        run: |
          baked=$(./go/nl6/nl6 -version)
          if [ -z "$baked" ] || [ -z "${GITHUB_REF_NAME}" ]; then
            echo "version assertion failed: empty value — baked='$baked', tag='${GITHUB_REF_NAME}'"
            exit 1
          fi
          if [ "$baked" != "${GITHUB_REF_NAME}" ]; then
            echo "version drift: binary reports '$baked', tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "version OK: $baked"

      - name: Assert Nix package version matches tag
        if: ${{ inputs.assert-version-matches-tag }}
        # A flake cannot read the git tag, so deploy/packages/nix/package.nix
        # carries a hardcoded version bumped per release. Fail loudly if that
        # bump was forgotten, rather than shipping a stale Nix version.
        run: |
          nixver=$(sed -nE 's/.*version \? "([^"]+)".*/\1/p' deploy/packages/nix/package.nix | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ -z "$nixver" ]; then
            echo "could not parse version from deploy/packages/nix/package.nix"
            exit 1
          fi
          if [ "$nixver" != "$tag" ]; then
            echo "Nix version drift: package.nix is '$nixver', tag is '$tag'."
            echo "Bump 'version ? \"...\"' in deploy/packages/nix/package.nix (see RELEASING.md) and re-tag."
            exit 1
          fi
          echo "Nix version OK: $nixver"

      - name: Test
        run: make test

      # Race-detector pass (ci-quality-gates spec): a step, not a job, so no
      # new required-check name (branch protection + ruleset stay untouched).
      # If job wall time becomes a problem, the plain Go run above can be
      # dropped — this run supersets it.
      - name: Test (race detector)
        run: make test-race

      # The interop gate. Everything above reads nl6's output with nl6's own
      # parser; this is the only step in which an independent implementation
      # decides whether nl6 is right (nl6#624). It was opt-in and unrun when it
      # landed, and its first manual run failed every row with the suite green,
      # so leaving it out of CI would retire the one check with detection power.
      - name: Install net-snmp
        run: sudo apt-get update && sudo apt-get install -y snmp

      - name: Test (SNMPv3 interop with net-snmp)
        run: make test-interop

  quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go/go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Install quality tools
        run: make tools-quality

      - name: Format check (gofmt + goimports)
        run: make fmt-check

      - name: Lint (golangci-lint)
        run: make lint

      - name: Vulnerability scan (govulncheck)
        run: make vuln

      - name: Security scan (gosec)
        run: make sec
