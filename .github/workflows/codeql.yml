name: CodeQL

# Advanced setup, replacing GitHub's default setup.
#
# The move was forced, not cosmetic. Default setup runs the Go extractor with
# GOTOOLCHAIN=local and a bundled Go older than go.mod requires, so once the
# toolchain moved to 1.27 every Go analysis failed with
# "go.mod requires go >= 1.27.0 (running go 1.26.6; GOTOOLCHAIN=local)".
# That is a merge blocker in its own right: the "protect main" ruleset carries a
# code_scanning rule with alerts_threshold=errors, which is separate from the
# required status checks.
#
# Default setup is configured in repo settings and exposes no way to set an env
# var, and setting GOTOOLCHAIN in the Makefile is not enough either — the
# extractor runs its own Go tooling rather than the build target. A workflow is
# the only place the variable reaches both.
#
# Language coverage must stay equal to what default setup scanned
# (actions, go, javascript, javascript-typescript, typescript). The last three
# are the same extractor: `javascript-typescript` analyses both, and the two
# singular names are legacy aliases for it. Dropping a language here silently
# drops scanning for it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory is found on an idle repo too.
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Uploading results is the point of the job.
      security-events: write
      # The action reads workflow run status to attach results to the run.
      actions: read
      contents: read
    env:
      # The reason this workflow exists. Applies to the whole job, so it reaches
      # the CodeQL extractor's own go invocations and not just `make build`.
      # `auto` is Go's default; CodeQL overrides it to `local`, which refuses to
      # honour the toolchain go.mod pins.
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            queries: ''
          - language: go
            build-mode: autobuild
            # The 21 Go correctness queries (index-out-of-bounds,
            # duplicate-condition, impossible-interface-nil-check, ...) on
            # top of the default suite. `queries:` ADDS to the default; it
            # does not replace it.
            #
            # NOT `security-and-quality`. That applies
            # security-and-frozen-quality-selectors.yml, which pulls in
            # security-extended and with it `go/log-injection` — 50
            # findings here, every one a typed value that cannot carry a
            # newline, and all at severity `error`, which blocks every PR
            # under the ruleset's code_scanning rule. `go-code-quality`
            # applies code-quality-selectors.yml and imports no security
            # suite, so the security surface is unchanged and nothing is
            # suppressed.
            #
            # Verified on a branch push before landing (nl6#479): the
            # suite name resolves and reports zero findings here. A PR
            # cannot verify either — CodeQL is diff-informed on pull
            # requests and computes nothing for unchanged Go files.
            queries: go-code-quality
          - language: javascript-typescript
            build-mode: none
            queries: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Before init: the extractor inspects the toolchain during database
      # creation, so a Go newer than the bundle's has to already be on PATH.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Per language: go-code-quality is a Go suite and does not
          # resolve for the actions or javascript-typescript extractors.
          queries: ${{ matrix.queries }}
          # HISTORY, because both mistakes are easy to repeat.
          #
          # An early revision set `security-and-quality` inside a Go-toolchain
          # PR described as leaving coverage unchanged. True of languages,
          # quietly false of queries: 50 previously-unqueried
          # `go/log-injection` findings appeared on main at once, all severity
          # `error`, and the "protect main" ruleset's code_scanning rule
          # blocked every subsequent PR on a posture change nobody agreed to.
          # Reverted in #478. `go-code-quality` above is the deliberate
          # version of that intent, minus the security pack.
          #
          # The revert then set `queries: default`, which is NOT a pack name —
          # the analysis fails outright with "Query pack default cannot be
          # found". Omitting the key is how you get the default suite, and the
          # per-language empty string above does exactly that for the
          # extractors that take no extra queries.

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: /language:${{ matrix.language }}
