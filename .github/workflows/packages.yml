name: Packages

# Build the .deb / .rpm packages and smoke-test that they install cleanly in
# fresh distro containers. Scoped to packaging-affecting paths so it does not
# run on every code change (ci.yml already covers the Go build).
on:
  push:
    branches: [main]
    paths:
      - 'deploy/packages/**'
      - 'Makefile'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'deploy/packages/**'
      - 'Makefile'
      - '.github/workflows/packages.yml'
  # The smoke matrix is the ONLY guard this repo has against upstream base-image
  # drift, and the paths above mean it runs only when someone touches packaging.
  # That is the wrong trigger for the thing it actually catches: the images move
  # on their own schedule, not ours. nl6#610 is the worked example. CentOS
  # Stream 10 was republished with an OCI image layout in place of a root
  # filesystem, nothing here changed, and the break was discovered days later as
  # a red X on an unrelated pull request, where it blocked work that had nothing
  # to do with packaging. A weekly run turns that into an isolated signal that
  # names the broken image and blocks nobody. Off the hour on purpose: GitHub
  # drops scheduled runs it cannot place during the load spike at :00.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group because `schedule` and `push` to main share a
# ref, so without it a cron run and a real push to main cancel each other and
# whichever lost leaves no result. Pull requests already carry a distinct ref.
concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build & smoke-test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so `git describe` bakes a real version into the
          # binary and the package filenames.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # ubuntu-24.04 runners ship Docker, which `make smoke` uses to install
      # the amd64 packages in debian/ubuntu/rocky/alma/centos-stream containers.
      - name: Build packages and smoke-test installation
        run: make smoke
