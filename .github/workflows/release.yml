name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # Prerelease tags (v2.0.0-rc1, -beta, …) are NOT released: RCs are the
      # floating `:rc` image fed by main pushes (see RELEASING.md). Excluding
      # them here means `:latest` and the stable Release can never be moved by
      # a prerelease tag.
      - '!v*-*'

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight release — a cancelled run publishes half of itself.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates PRs enforce (build + test + code quality), plus the release-only
  # version/tag assertions — so a release can never publish through a gate that
  # main is held to.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      assert-version-matches-tag: true

  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gates
    permissions:
      contents: write      # create the draft Release + upload assets
      id-token: write      # cosign keyless + build provenance (OIDC)
      attestations: write  # SLSA build provenance attestations
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build release binaries and packages
        # `packages` depends on `dist`, so this builds the simulator (linux
        # amd64/arm64), the nl6-reconcile CLI (all OS/arch), and the .deb/.rpm.
        run: make packages

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- nl6-linux-amd64 nl6-linux-arm64 nl6-reconcile-* *.deb *.rpm > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign checksums (cosign keyless)
        working-directory: dist
        # cosign v3+ defaults to the new Sigstore bundle format: a single
        # self-contained .cosign.bundle (signature + cert + Rekor entry). The
        # legacy --output-signature/--output-certificate flags are ignored under
        # it, so emit the bundle. Verify with `cosign verify-blob --bundle`.
        run: |
          cosign sign-blob --yes checksums.txt --bundle checksums.txt.cosign.bundle

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/nl6.sbom.spdx.json
          upload-artifact: false

      - name: Render SBOM as HTML (blitsbom)
        # Human-readable companion to the SPDX JSON — a single self-contained
        # offline page a reviewer can open without any tooling. Written into
        # dist/ so it rides along in the nl6-binaries artifact and is attached
        # to the Release next to the JSON.
        #
        # `image` is set explicitly: the action defaults to the floating
        # `:report-rc` tag, which must never decide the content of a release
        # artifact. Keep the tag in step with the action version above.
        #
        # Runs `docker run` on a public GHCR image; no registry login is needed
        # (verified anonymously pullable), so this job keeps `packages: none`.
        uses: no42-org/blitsbom/report@38567e05bf41bd3348d928b657eca0efeeaa7db6  # v0.4.0
        with:
          sbom: dist/nl6.sbom.spdx.json
          output: dist/nl6.sbom.report.html
          image: ghcr.io/no42-org/blitsbom:report-0.4.0
          # project defaults to the repo name; version/commit/build-url are
          # derived from the tag ref and run context.

      - name: Attest build provenance (release artifacts)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist/nl6-linux-amd64
            dist/nl6-linux-arm64
            dist/nl6-reconcile-*
            dist/*.deb
            dist/*.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nl6-binaries
          path: dist/
          retention-days: 7

      - name: Create draft GitHub Release
        # Draft so a maintainer curates the notes and verifies the signatures /
        # SBOM / provenance before publishing (see RELEASING.md).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/nl6-linux-amd64
            dist/nl6-linux-arm64
            dist/nl6-reconcile-*
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            dist/nl6.sbom.spdx.json
            dist/nl6.sbom.report.html

  docker:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: gates
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # cosign keyless + provenance (OIDC)
      attestations: write  # SLSA build provenance
      # Required by actions/attest v4+ to create the Artifact Metadata
      # Storage Record it emits when `push-to-registry: true` (per its
      # README: "necessary to create the artifact storage record").
      # Without it, v0.19.1's run warned "check that the
      # artifact-metadata:write permission has been included" and the
      # storage record was skipped (the attestation itself still worked).
      # The `release` job above deliberately does NOT carry this scope:
      # it attests subject-path files without push-to-registry, so no
      # storage record is attempted there — that is why only this job
      # warned. (#344)
      artifact-metadata: write
    env:
      APP_VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stable tags only reach this workflow (prereleases are excluded above), so
      # a tag push always publishes the immutable `:vX.Y.Z` plus the floating
      # `:latest`. RC images are `ci.yml`'s `:rc` (push to main).
      - name: Build and push multi-platform image
        run: make docker-push DOCKER_TAGS="$IMAGE:$APP_VERSION $IMAGE:latest"

      - name: Resolve pushed image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$APP_VERSION" --format '{{ .Manifest.Digest }}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest: $digest"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
