name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight release — a cancelled run publishes half of itself.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates PRs enforce (build + test + code quality), plus the release-only
  # version/tag assertions — so a release can never publish through a gate that
  # main is held to.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      assert-version-matches-tag: true

  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gates
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build release binaries and packages
        # `packages` depends on `dist`, so this builds the linux amd64/arm64
        # binaries and then the .deb / .rpm packages for both arches.
        run: make packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nl6-binaries
          path: dist/
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/nl6-linux-amd64
            dist/nl6-linux-arm64
            dist/nl6-reconcile-*
            dist/*.deb
            dist/*.rpm

  docker:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: gates
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stable tag pushes publish an immutable `:vX.Y.Z` tag plus the floating
      # `:latest` alias. Release candidates are handled entirely by ci.yml's
      # `Publish RC image` job (push to main -> `:rc`), so this workflow only
      # ever sees stable tags.
      - name: Build and push multi-platform image
        run: make docker-push DOCKER_TAGS="$IMAGE:$APP_VERSION $IMAGE:latest"
