name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Tag-event workflow: bake the pushed tag into the binary as the
      # ground-truth version. Overrides the Makefile's `git describe`
      # fallback, which is unreliable inside actions/checkout's shallow
      # clone.
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify go.mod is tidy
        run: make check-tidy

      - name: Build
        run: make build

      - name: Assert baked version matches tag
        run: |
          baked=$(./go/nl6/nl6 -version)
          if [ -z "$baked" ] || [ -z "${GITHUB_REF_NAME}" ]; then
            echo "version assertion failed: empty value — baked='$baked', tag='${GITHUB_REF_NAME}'"
            exit 1
          fi
          if [ "$baked" != "${GITHUB_REF_NAME}" ]; then
            echo "version drift: binary reports '$baked', tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "version OK: $baked"

      - name: Assert Nix package version matches tag
        # A flake cannot read the git tag, so deploy/packages/nix/package.nix
        # carries a hardcoded version bumped per release. Fail loudly if that
        # bump was forgotten, rather than shipping a stale Nix version.
        run: |
          nixver=$(sed -nE 's/.*version \? "([^"]+)".*/\1/p' deploy/packages/nix/package.nix | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ -z "$nixver" ]; then
            echo "could not parse version from deploy/packages/nix/package.nix"
            exit 1
          fi
          if [ "$nixver" != "$tag" ]; then
            echo "Nix version drift: package.nix is '$nixver', tag is '$tag'."
            echo "Bump 'version ? \"...\"' in deploy/packages/nix/package.nix (see RELEASING.md) and re-tag."
            exit 1
          fi
          echo "Nix version OK: $nixver"

      - name: Test
        run: make test

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: ci
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build release binaries and packages
        # `packages` depends on `dist`, so this builds the linux amd64/arm64
        # binaries and then the .deb / .rpm packages for both arches.
        run: make packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nl6-binaries
          path: dist/
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v2
        with:
          generate_release_notes: true
          files: |
            dist/nl6-linux-amd64
            dist/nl6-linux-arm64
            dist/*.deb
            dist/*.rpm

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: ci
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stable tag pushes publish an immutable `:vX.Y.Z` tag plus the floating
      # `:latest` alias. Release candidates are handled entirely by ci.yml's
      # `Publish RC image` job (push to main -> `:rc`), so this workflow only
      # ever sees stable tags.
      - name: Build and push multi-platform image
        run: make docker-push DOCKER_TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }} ghcr.io/${{ github.repository }}:latest"
