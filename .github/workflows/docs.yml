name: Docs

# Publishes the Docusaurus site at
# https://labmonkeys-space.github.io/nl6/ on every push to main. Toolchain
# and Node version are pinned via package-lock.json and .nvmrc respectively.
#
# First-deploy manual step: after this workflow succeeds for the first time
# following the Docusaurus migration, a maintainer must confirm the GitHub
# Pages source is still set to the `gh-pages` branch in Settings -> Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/docs.yml'
      - 'Makefile'
  # Rebuild the site after a release so the landing-page hero eyebrow
  # (version/license/Go version — resolved at build time in
  # docusaurus.config.ts) picks up the newly pushed tag.
  # No `branches:` filter here: Release runs on tag pushes, where the
  # upstream workflow's head_branch is the tag ref rather than a branch
  # name, and a `branches: [main]` filter would silently suppress the
  # trigger. The job-level `if: conclusion == 'success'` guard below is
  # sufficient protection.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deploy job pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    # When triggered by the Release workflow, only proceed if that run
    # succeeded. On direct pushes and manual dispatches this is trivially true.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # deploy action needs history to push to gh-pages
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install docs toolchain
        run: make docs-install

      - name: Verify strict build
        run: make docs-build

      - name: Generate website SBOM (syft)
        # The website is the repo's second product. This SBOM covers its full
        # npm BUILD TREE (devDependencies included) — the browser-delivered
        # subset is not separable at manifest level, so do not read every row
        # as visitor-executing code. It is generated HERE because this job has
        # node_modules installed (docs-install ran npm ci), so syft reads the
        # installed manifests — including legacy `licenses` arrays the
        # lockfile lacks — instead of being license-blind like a bare-checkout
        # scan.
        #
        # Scoping (simulator module, build outputs, vendored gem fixtures)
        # lives in .syft.yaml, the single exclude source. Do NOT reintroduce a
        # SYFT_EXCLUDE env here: env values REPLACE the config list rather
        # than merging, which silently dropped .syft.yaml's excludes in an
        # earlier draft of this step.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: nl6-website.sbom.spdx.json
          upload-artifact: false
          # Same pinned syft as release.yml: the SBOM contract was verified
          # against v1.46.0 specifically.
          syft-version: v1.46.0

      - name: Render website SBOM report (blitsbom)
        # Same pin discipline as release.yml: the action lives at the repo
        # root since v0.6.0, and it derives the generator image from the
        # pinned commit, so no explicit `image:` is needed. Public GHCR image,
        # no registry login.
        uses: no42-org/blitsbom@48e615d57bd2a11d808cf52eb9f86bb8e853bee9  # v0.8.0
        with:
          sbom: nl6-website.sbom.spdx.json
          output: nl6-website.sbom.report.html
          project: nl6-website

      - name: Retain SBOM as a workflow artifact
        # Deliberately NOT published on the site: a complete build-tree
        # inventory at a stable public URL is more disclosure than value. The
        # SBOM and report are retained on the run instead (Actions -> Docs),
        # available to maintainers on demand. The force_orphan deploy below
        # rebuilds gh-pages from build/ alone, which is what removed the
        # previously published /sbom/ path.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nl6-website-sbom
          path: |
            nl6-website.sbom.spdx.json
            nl6-website.sbom.report.html
          retention-days: 30

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
