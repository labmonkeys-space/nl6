name: Docs

# Publishes the Docusaurus site at
# https://labmonkeys-space.github.io/nl6/ on every push to main. Toolchain
# and Node version are pinned via package-lock.json and .nvmrc respectively.
#
# First-deploy manual step: after this workflow succeeds for the first time
# following the Docusaurus migration, a maintainer must confirm the GitHub
# Pages source is still set to the `gh-pages` branch in Settings -> Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/docs.yml'
      - 'Makefile'
  # Rebuild the site after a release so the landing-page hero eyebrow
  # (version/license/Go version — resolved at build time in
  # docusaurus.config.ts) picks up the newly pushed tag.
  # No `branches:` filter here: Release runs on tag pushes, where the
  # upstream workflow's head_branch is the tag ref rather than a branch
  # name, and a `branches: [main]` filter would silently suppress the
  # trigger. The job-level `if: conclusion == 'success'` guard below is
  # sufficient protection.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deploy job pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    # When triggered by the Release workflow, only proceed if that run
    # succeeded. On direct pushes and manual dispatches this is trivially true.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # deploy action needs history to push to gh-pages
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install docs toolchain
        run: make docs-install

      - name: Verify strict build
        run: make docs-build

      - name: Generate website SBOM (syft)
        # The website is the repo's second product: the built site's JS
        # (Docusaurus runtime, mermaid) executes in visitors' browsers. Its
        # SBOM is generated HERE because this job has node_modules installed
        # (docs-install/docs-build ran npm ci), so syft reads the installed
        # manifests — including legacy `licenses` arrays that the lockfile
        # lacks — instead of being license-blind like a bare-checkout scan.
        #
        # SYFT_EXCLUDE scopes out the simulator (its SBOM ships with the
        # release, derived from the binary) and build outputs. Manifests
        # vendored inside npm packages stay: truthful website-tree contents.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        env:
          SYFT_EXCLUDE: "./go/**,./dist/**,./build/**"
        with:
          path: .
          format: spdx-json
          output-file: nl6-website.sbom.spdx.json
          upload-artifact: false
          # Same pinned syft as release.yml: the SBOM contract was verified
          # against v1.46.0 specifically.
          syft-version: v1.46.0

      - name: Render website SBOM report (blitsbom)
        # Same pin discipline as release.yml: the action lives at the repo
        # root since v0.6.0, and v0.6.1 derives the generator image from the
        # pinned commit, so no explicit `image:` is needed. Public GHCR image,
        # no registry login.
        uses: no42-org/blitsbom@3f2e7abc338c05d40a15058eafc318fee310e05f  # v0.6.1
        with:
          sbom: nl6-website.sbom.spdx.json
          output: nl6-website.sbom.report.html
          project: nl6-website

      - name: Publish SBOM with the site
        # Stable URLs, documented in RELEASING.md:
        #   /sbom/nl6-website.sbom.spdx.json and /sbom/nl6-website.sbom.report.html
        run: |
          mkdir -p build/sbom
          cp nl6-website.sbom.spdx.json nl6-website.sbom.report.html build/sbom/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
