version: 2

updates:
  # A gomod bump invalidates the `vendorHash` pinned in
  # deploy/packages/nix/package.nix, which Dependabot has no way to update
  # (it has no post-update hook, and package.nix is outside its ecosystem
  # model). The Nix Cache workflow turns that stale hash red on the PR, and
  # both its legs, `Build & push (x86_64-linux)` and
  # `Build & push (aarch64-linux)`, are REQUIRED status checks on main: the
  # bump cannot merge until the hash is refreshed.
  # .github/workflows/dependabot-vendorhash.yml sweeps every ~6h and pushes
  # the corrected hash onto the branch, so the bump reaches a mergeable state
  # without a hand edit. To unblock one bump immediately instead of waiting
  # for the sweep, dispatch that workflow with the PR number. The manual path
  # (`make nix-vendor-hash`) stays valid and is the fallback if the sweep's
  # GitHub App credential is not configured. One consequence of that push:
  # Dependabot stops rebasing a PR once someone else has committed to its
  # branch, and an `@dependabot rebase` drops the repair commit, which the
  # next sweep then puts back.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/{init,autobuild,analyze} must run at the SAME
      # version inside one job: init writes a config file stamped with its
      # version and analyze refuses to load a config from a different one
      # ("Loaded a configuration file for version 'X', but running version
      # 'Y'"). Ungrouped, Dependabot opens one PR per sub-action and every
      # one of them fails CI on its own, so none can merge. Collapse them
      # into a single PR that moves all the pins together.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base image in the repo-root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Pyroscope + Alloy images in the profiling example, written as literal
  # `image:` lines (this parser skips the ${VAR:-default} form). The
  # Makefile's test-interop-pyroscope reads its pins from the same lines, so
  # a bump here is the whole bump.
  - package-ecosystem: docker-compose
    directory: /examples/pyroscope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Docs site (Docusaurus) npm dependencies, manifest at the repo root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Collapse the ~29 @docusaurus/* packages into a single PR per bump.
      docusaurus:
        patterns:
          - "@docusaurus/*"
