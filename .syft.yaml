# Syft configuration shared by BOTH SBOM pipelines (anchore/sbom-action picks
# this up from the workspace root). Goal: no "Undeclared" licenses for
# anything we ship.
#
# - release.yml scans the shipped binary (file:dist/nl6-linux-amd64): it uses
#   the golang/cataloger settings below; the path excludes do not apply to
#   file: sources (verified with syft 1.46.0).
# - docs.yml scans the repo directory for the website SBOM: the path excludes
#   below are what scope that scan. Keep them here — a SYFT_EXCLUDE env on the
#   workflow step REPLACES this list instead of merging with it.

golang:
  # go.mod alone carries no license metadata; let syft read the module cache
  # (populated by the release build in the same job) and fall back to the
  # module proxy so every Go dependency resolves its actual license.
  search-local-mod-cache-licenses: true
  search-remote-licenses: true

# CI actions are build tooling, not shipped product — their provenance is
# covered by the build attestation, and the catalogers can never resolve a
# license for them (always NOASSERTION).
select-catalogers:
  - "-github-actions-usage-cataloger"
  - "-github-action-workflow-usage-cataloger"

exclude:
  # dist/ holds release artifacts; a directory scan cataloging them would
  # self-reference the binaries and duplicate every Go module via the binary
  # cataloger. (The release SBOM scans one of these binaries explicitly, as a
  # file: source, which this exclude does not affect.)
  - ./dist/**
  # The simulator module is the release's product, covered by the
  # binary-derived SBOM attached to the GitHub Release; the website SBOM must
  # not re-inventory it.
  - ./go/**
  # Docusaurus build output — the generated site, not a dependency tree.
  - ./build/**
  # CI/CD pipeline files are not part of the shipped product. The cataloger
  # deselection above already covers today's syft; the path exclude guarantees
  # no future cataloger resurfaces them.
  - ./.github/**
  # Gitignored local dev artifacts — absent in CI; excluded so a local
  # `syft scan dir:.` produces the same result as the release job.
  - ./.venv/**
  - ./go/nl6/nl6
  - ./go/nl6-reconcile
  # Ruby build fixture shipped inside an npm dependency of the docs site
  # (a Gemfile.lock for its stopwords generator) — not part of anything nl6
  # builds or ships, and gem lockfiles carry no license metadata.
  - ./node_modules/lunr-languages/build/**
